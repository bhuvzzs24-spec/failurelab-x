name: Safe CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: lab, POSTGRES_PASSWORD: local, POSTGRES_DB: lab_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lab -d lab_ci" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_MODE: local
      API_TOKEN: local-development-token
      TEST_POSTGRES_URL: postgresql+psycopg://lab:local@127.0.0.1:5432/lab_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: python -m pip install -c constraints.txt '.[test]'
      # Explicit allowlist: ASGI/API/unit tests and owned database migrations only.
      # No sample services, fault proxies, workers, or candidate containers execute.
      - run: python scripts/test_ci.py
      - run: python scripts/check_secrets.py
      - run: python scripts/validate_cloud.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check_client_api.mjs
        working-directory: .
      - run: npm audit --audit-level=high
  python-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r constraints.txt --no-deps --disable-pip
  container-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      # Build validation only. Never run the fault or patch execution containers here.
      - run: docker compose config --quiet
      - run: docker build -t failurelab-api-ci .
      - run: docker build -f infrastructure/Dockerfile.verifier -t failurelab-verifier-ci .
      - run: docker build -f infrastructure/Dockerfile.agent -t failurelab-agent-ci .
      - run: docker build -f frontend/Dockerfile -t failurelab-ui-ci .
